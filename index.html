<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piano Path">
<title>Piano Learning Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow practice column, sticky tabs on top, metronome docked at the bottom. */
:root{
  --bg:#F3F3F0; --surface:#FFFFFF; --ink:#17181C; --muted:#5D616A; --line:#DCDCD6;
  --accent:#9E2A2B; --accent-soft:#F4E3E2; --on-accent:#FFFFFF;
  --good:#2C7A4B; --good-soft:#DFF0E5; --warn:#A86A12; --warn-soft:#F6EBD6;
  --key-white:#FFFFFF; --key-black:#202126;
  --font-display:"Bodoni Moda", "Didot", "Times New Roman", serif;
  --font-body:"IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111216; --surface:#1B1C21; --ink:#ECECE7; --muted:#A0A4AD; --line:#30323A;
    --accent:#E2625F; --accent-soft:#3A2224; --on-accent:#16070A;
    --good:#5CC088; --good-soft:#1C3326; --warn:#E3AA4E; --warn-soft:#3A2E19;
    --key-white:#E6E6E1; --key-black:#08080A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111216; --surface:#1B1C21; --ink:#ECECE7; --muted:#A0A4AD; --line:#30323A;
  --accent:#E2625F; --accent-soft:#3A2224; --on-accent:#16070A;
  --good:#5CC088; --good-soft:#1C3326; --warn:#E3AA4E; --warn-soft:#3A2E19;
  --key-white:#E6E6E1; --key-black:#08080A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-bottom:110px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.6rem} h2{font-size:1.35rem} h3{font-size:1.05rem;font-family:var(--font-body);font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.busy{background:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
main{padding:20px 0 24px;display:grid;gap:20px}
main>*,.card,.stage>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.muted{color:var(--muted)} .small{font-size:.86rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.accent{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.88rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;min-height:36px;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* Today */
.hero{display:grid;gap:6px}
.blocks{display:grid;gap:10px;margin-top:4px}
.block{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);border-left:4px solid var(--line)}
.block.done{border-left-color:var(--good);opacity:.72}
.block.active{border-left-color:var(--accent)}
.block .mins{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.2em;text-align:right}
.block .cat{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.block .ttl{font-weight:600}
.block .ctl{display:grid;gap:6px;justify-items:end}
.check{width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;margin-top:2px}
.check[aria-checked="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.check svg{width:16px;height:16px}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:1.05rem}
/* Path */
.stage{display:grid;gap:12px}
.stage-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.items{display:grid;gap:2px}
.item{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:500}
.item.on .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.group-label{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-top:8px}
.criteria{margin:0;padding-left:1.2em}
details.stage-card>summary{cursor:pointer;list-style:none}
details.stage-card>summary::-webkit-details-marker{display:none}
/* Technique */
.kbd{width:100%;max-width:520px;height:auto;display:block}
.kbd .k{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.84rem;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td input{width:4.2em;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right}
.st{border:0;cursor:pointer;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600}
.st.solid{background:var(--good-soft);color:var(--good)} .st.learning{background:var(--warn-soft);color:var(--warn)} .st.none{background:var(--line);color:var(--muted)}
/* Log */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-family:var(--font-display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
form.logf{display:grid;gap:10px}
label{font-size:.86rem;font-weight:500;display:grid;gap:4px}
input[type=number],input[type=date],textarea,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
.entry{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:2px}
.entry:first-child{border-top:0}
/* Metronome dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.dock .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.bpm{display:flex;align-items:center;gap:6px}
.bpm output{font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:2.4em;text-align:center}
.beats{display:flex;gap:5px}
.beats i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.beats i.on{background:var(--accent)}
input[type=range]{accent-color:var(--accent);width:140px}
@media (max-width:520px){
  h1{font-size:1.35rem}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .stat b{font-size:1.35rem}
  input[type=range]{display:none}
  .block{grid-template-columns:auto 1fr}
  .block .ctl{grid-column:2;justify-items:start;grid-auto-flow:column;align-items:center}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1>Piano Learning Path</h1>
      <div class="sync" id="sync" role="status"><span class="dot" id="syncDot"></span><span id="syncText">Saved on this device</span></div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-view="today">Today</a>
      <a href="#path" data-view="path">Path</a>
      <a href="#technique" data-view="technique">Technique</a>
      <a href="#log" data-view="log">Practice log</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="dock" aria-label="Metronome">
  <div class="wrap">
    <div class="bpm">
      <button class="btn sm" id="mDown" aria-label="Slower">−</button>
      <output id="mBpm" aria-live="polite">95</output>
      <button class="btn sm" id="mUp" aria-label="Faster">+</button>
      <input type="range" id="mRange" min="30" max="220" value="95" aria-label="Tempo in beats per minute">
    </div>
    <div class="seg" role="group" aria-label="Beats per bar" id="mBeats">
      <button data-b="1">1</button><button data-b="2">2</button><button data-b="3" aria-pressed="true">3</button><button data-b="4">4</button>
    </div>
    <div class="beats" id="mDots" aria-hidden="true"></div>
    <div class="row">
      <button class="btn sm" id="mTap">Tap</button>
      <button class="btn primary" id="mGo">Start</button>
    </div>
  </div>
</div>

<script>
/* ---------- Content ---------- */
const KEYS=[{k:"C",m:"A"},{k:"G",m:"E"},{k:"D",m:"B"},{k:"A",m:"F♯"},{k:"E",m:"C♯"},{k:"B",m:"G♯"},{k:"F#",m:"D♯"},{k:"Db",m:"B♭"},{k:"Ab",m:"F"},{k:"Eb",m:"C"},{k:"Bb",m:"G"},{k:"F",m:"D"}];
const NEW_ARP_ORDER=["F","F#","Db","Ab","Eb","Bb"];
const pretty=k=>k.replace("#","♯").replace(/^([A-G])b$/,"$1♭");
const imslp=q=>"https://imslp.org/index.php?search="+encodeURIComponent(q);
const CAT={T:"Technique",E:"Études",R:"Repertoire",H:"Theory",S:"Sight-reading"};

const STAGES=[
 {n:1,name:"Consolidate and widen",span:"about 3 months",
  focus:"Finish the easier keys of the Russian arpeggio cycle, add harmonic and melodic minor, and take your first Chopin preludes alongside the two waltzes.",
  criteria:["Russian arpeggios solid in 8 keys","Harmonic minor in all keys at 95","E minor Prelude played start to finish with pedal","One Burgmüller étude at tempo"],
  items:[
   {id:"s1t1",c:"T",t:"Russian arpeggios in F major / D minor",d:"White-key start with the same shapes as C. Hands separately and slowly first."},
   {id:"s1t2",c:"T",t:"Russian arpeggios in F♯ major / D♯ minor",d:"An all-black triad. Keep the wrist level and let the arm carry the hand over the thumb."},
   {id:"s1t3",c:"T",t:"Harmonic minor, all 12 keys, 80 then 95",d:"You already have the natural minors: raise the 7th."},
   {id:"s1t4",c:"T",t:"Melodic minor, all 12 keys, at 80",d:"Raised 6th and 7th going up, natural minor coming down."},
   {id:"s1t5",c:"T",t:"Chromatic scale, hands together, 2 octaves",d:"Fingering 1-3 on black-and-white pairs, 1-2 on E–F and B–C."},
   {id:"s1e1",c:"E",t:"Burgmüller Op. 100 No. 2, Arabesque",d:"Even right-hand groups over a light left-hand staccato.",q:"Burgmüller 25 Etudes Op.100"},
   {id:"s1e2",c:"E",t:"Burgmüller Op. 100 No. 15, Ballade",d:"Left-hand melody with right-hand repeated chords.",q:"Burgmüller 25 Etudes Op.100"},
   {id:"s1r1",c:"R",t:"Chopin Prelude in E minor, Op. 28 No. 4",d:"Practise the left-hand chords alone and listen for the one note that moves each time.",q:"Chopin Preludes Op.28"},
   {id:"s1r2",c:"R",t:"Chopin Prelude in B minor, Op. 28 No. 6",d:"Melody in the left hand, in the same key as your Op. 69 No. 2 waltz.",q:"Chopin Preludes Op.28"},
   {id:"s1r3",c:"R",t:"Bach Little Prelude in C major, BWV 939",d:"A first step into Baroque touch and finger independence.",q:"Bach Little Preludes BWV 939"},
   {id:"s1r4",c:"R",t:"Schumann Album for the Young Op. 68 No. 10, The Happy Farmer",d:"Sing the left-hand tune over a soft right hand.",q:"Schumann Album für die Jugend Op.68"},
   {id:"s1h1",c:"H",t:"Key signatures and the circle of fifths by heart",d:"Say the signature for any key in under two seconds."},
   {id:"s1h2",c:"H",t:"Primary chords I, IV, V and V7 in every major key",d:"Then find them in both of your waltzes."},
   {id:"s1s1",c:"S",t:"Sight-read 5 minutes a day",d:"Choose music a level below what you play, and keep going without stopping."}
  ]},
 {n:2,name:"First nocturne",span:"3 to 4 months",
  focus:"Your first nocturne and mazurka, Bach with two clear voices, and scales pushed to 110.",
  criteria:["Russian arpeggios solid in 10 keys","All scales at 110","C♯ minor Nocturne performable","A Bach piece with both voices clearly shaped"],
  items:[
   {id:"s2t1",c:"T",t:"Russian arpeggios in D♭ major / B♭ minor",d:"Thumbs on white keys only where the fingering allows; check each hand's fingering before speeding up."},
   {id:"s2t2",c:"T",t:"Russian arpeggios in A♭ major / F minor"},
   {id:"s2t3",c:"T",t:"All scales hands together at 110"},
   {id:"s2t4",c:"T",t:"Scales in contrary motion, all keys"},
   {id:"s2t5",c:"T",t:"Scales in thirds and sixths: C, G, D, A"},
   {id:"s2e1",c:"E",t:"Burgmüller Op. 100 No. 18, Inquiétude",q:"Burgmüller 25 Etudes Op.100"},
   {id:"s2e2",c:"E",t:"Burgmüller Op. 100 No. 25, La chevaleresque",q:"Burgmüller 25 Etudes Op.100"},
   {id:"s2r1",c:"R",t:"Chopin Nocturne in C♯ minor, B. 49 (Lento con gran espressione)",d:"Learn the left hand first. Leave the right-hand runs for last and practise them slowly in rhythm groups.",q:"Chopin Nocturne C-sharp minor B.49"},
   {id:"s2r2",c:"R",t:"Chopin Mazurka in A minor, Op. 68 No. 2",d:"Feel the accent on beat 2 or 3, which sets the mazurka apart from the waltz.",q:"Chopin Mazurkas Op.68"},
   {id:"s2r3",c:"R",t:"Bach Little Prelude in D minor, BWV 926",q:"Bach Prelude BWV 926"},
   {id:"s2r4",c:"R",t:"Schumann Op. 68 No. 12, Knecht Ruprecht",q:"Schumann Album für die Jugend Op.68"},
   {id:"s2r5",c:"R",t:"Grieg Lyric Pieces Op. 12 No. 1, Arietta",q:"Grieg Lyric Pieces Op.12"},
   {id:"s2h1",c:"H",t:"Diminished 7th chords and how they resolve"},
   {id:"s2h2",c:"H",t:"Harmonic analysis of the B minor Waltz, Op. 69 No. 2",d:"Mark each chord in your score with a Roman numeral."},
   {id:"s2s1",c:"S",t:"Sight-read four-part chorales or hymns"}
  ]},
 {n:3,name:"Wider style",span:"4 to 6 months",
  focus:"Complete the 12-key arpeggio cycle, take on two-part inventions, and add Grieg and Mendelssohn to your Chopin.",
  criteria:["Russian arpeggios in all 12 keys","All scales at 120","C♯ minor Waltz at a flowing tempo","Two Inventions memorised"],
  items:[
   {id:"s3t1",c:"T",t:"Russian arpeggios in E♭ major / C minor"},
   {id:"s3t2",c:"T",t:"Russian arpeggios in B♭ major / G minor",d:"This completes the cycle of 12 keys."},
   {id:"s3t3",c:"T",t:"All scales at 120, harmonic and melodic minor included"},
   {id:"s3t4",c:"T",t:"Chromatic scale in contrary motion and a minor third apart"},
   {id:"s3e1",c:"E",t:"Czerny Op. 849, selected études",q:"Czerny Op.849"},
   {id:"s3e2",c:"E",t:"Heller Op. 47, selected études",q:"Heller 25 Etudes Op.47"},
   {id:"s3r1",c:"R",t:"Chopin Waltz in C♯ minor, Op. 64 No. 2",q:"Chopin Waltzes Op.64"},
   {id:"s3r2",c:"R",t:"Chopin Nocturne in E♭ major, Op. 9 No. 2",q:"Chopin Nocturnes Op.9"},
   {id:"s3r3",c:"R",t:"Bach Two-Part Invention No. 1 in C major, BWV 772",q:"Bach Inventions BWV 772"},
   {id:"s3r4",c:"R",t:"Bach Two-Part Invention No. 8 in F major, BWV 779",q:"Bach Inventions BWV 772"},
   {id:"s3r5",c:"R",t:"Grieg Lyric Pieces Op. 12 No. 2, Waltz",q:"Grieg Lyric Pieces Op.12"},
   {id:"s3r6",c:"R",t:"Mendelssohn Song Without Words Op. 30 No. 3",q:"Mendelssohn Lieder ohne Worte Op.30"},
   {id:"s3h1",c:"H",t:"Modulation: find every key change in the C♯ minor Waltz"},
   {id:"s3s1",c:"S",t:"Sight-read song accompaniments and easy chamber parts"}
  ]},
 {n:4,name:"Toward advanced",span:"6 months and more",
  focus:"The Minute Waltz, a Bach prelude and fugue, Schubert and Debussy, with technique in every key.",
  criteria:["All scales at 132","A prelude and fugue performed","Two contrasting Chopin pieces from this stage performed"],
  items:[
   {id:"s4t1",c:"T",t:"All scales at 132, and in thirds and sixths in every key"},
   {id:"s4t2",c:"T",t:"Dominant 7th and diminished 7th arpeggios, all keys, 4 octaves"},
   {id:"s4t3",c:"T",t:"Double-third scale in C major, hands separately"},
   {id:"s4e1",c:"E",t:"Czerny Op. 299, selected études",q:"Czerny Op.299"},
   {id:"s4r1",c:"R",t:"Chopin Waltz in D♭ major, Op. 64 No. 1 (Minute)",q:"Chopin Waltzes Op.64"},
   {id:"s4r2",c:"R",t:"Chopin Nocturne in E minor, Op. 72 No. 1",q:"Chopin Nocturne Op.72 No.1"},
   {id:"s4r3",c:"R",t:"Chopin Mazurka in B♭ major, Op. 7 No. 1",q:"Chopin Mazurkas Op.7"},
   {id:"s4r4",c:"R",t:"Bach Prelude and Fugue in C major, WTC I, BWV 846",q:"Bach Well-Tempered Clavier Book 1"},
   {id:"s4r5",c:"R",t:"Schubert Impromptu in A♭ major, Op. 142 No. 2 (D. 935)",q:"Schubert Impromptus D.935"},
   {id:"s4r6",c:"R",t:"Debussy, Rêverie",q:"Debussy Rêverie"},
   {id:"s4h1",c:"H",t:"Form: binary, ternary and rondo; map each piece you play"},
   {id:"s4s1",c:"S",t:"Sight-read Stage 2 pieces fluently"}
  ]}
];
const MAINTAIN=[{t:"Chopin Waltz in A minor, B. 150",d:"Play it through once, then fix one spot."},{t:"Chopin Waltz in B minor, Op. 69 No. 2",d:"Play it through once, then fix one spot."}];

/* ---------- State ---------- */
const LS="pianoPath.v1";
const todayStr=()=>new Date().toLocaleDateString("en-CA");
function defaults(){
  const arps={},scales={};
  KEYS.forEach((o,i)=>{arps[o.k]=i<6?"solid":"none";scales[o.k]={maj:95,nat:95,harm:0,mel:0};});
  return {v:1,settings:{minutes:45,stage:1},arps,scales,checks:{},log:[],today:null,updatedAt:0};
}
function normalize(s){
  const d=defaults(); if(!s||typeof s!=="object") return d;
  return {v:1,settings:Object.assign(d.settings,s.settings||{}),arps:Object.assign(d.arps,s.arps||{}),
    scales:Object.assign(d.scales,s.scales||{}),checks:s.checks||{},log:Array.isArray(s.log)?s.log:[],
    today:s.today||null,updatedAt:s.updatedAt||0};
}
let state=defaults();
try{const raw=localStorage.getItem(LS); if(raw) state=normalize(JSON.parse(raw));}catch(e){}
const clone=o=>JSON.parse(JSON.stringify(o));
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}

/* ---------- Sync (claude db, falls back to this device) ---------- */
let ref=null, remoteOK=false, writing=false, dirty=false, debounce=null, pending=false;
function setSync(kind,text){document.getElementById("syncDot").className="dot "+(kind||"");document.getElementById("syncText").textContent=text;}
function commit(){
  state.updatedAt=Date.now(); saveLocal(); render();
  if(!remoteOK) return;
  setSync("busy","Saving…"); pending=true;
  clearTimeout(debounce); debounce=setTimeout(flush,1200);
}
async function flush(){
  if(!ref||!remoteOK) return;
  pending=false;
  if(writing){dirty=true;return;}
  writing=true; dirty=false;
  try{ await ref.set(clone(state)); setSync("ok","Synced"); }
  catch(e){
    if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{await ref.set(clone(state));setSync("ok","Synced");}catch(e2){setSync("","Saved on this device");} }
    else if(e&&e.code==="quota_exceeded"){setSync("busy","Sync storage full; saved on this device");}
    else {remoteOK=false;setSync("","Saved on this device");}
  }
  writing=false; if(dirty) flush();
}
async function connect(){
  if(!window.claude||typeof window.claude.use!=="function"){setSync("","Saved on this device");return;}
  setSync("busy","Connecting…");
  let db=null; try{db=await window.claude.use("db");}catch(e){}
  if(!db){setSync("","Saved on this device");return;}
  try{
    ref=db.doc("piano/state");
    const snap=await ref.get();
    remoteOK=true;
    if(snap.exists){
      const remote=normalize(snap.data());
      if((remote.updatedAt||0)>=(state.updatedAt||0)){state=remote;saveLocal();render();setSync("ok","Synced");}
      else flush();
    } else { await flush(); }
    const t=setTimeout(()=>setSync("busy","Can't reach sync yet"),10000);
    ref.onSnapshot(s=>{
      clearTimeout(t);
      if(!s.exists||s.metadata.hasPendingWrites) return;
      const r=normalize(s.data());
      if(r.updatedAt>state.updatedAt&&!writing&&!pending){state=r;saveLocal();render();}
      if(!s.metadata.fromCache&&!writing) setSync("ok","Synced");
    },()=>{clearTimeout(t);remoteOK=false;setSync("","Saved on this device");});
  }catch(e){remoteOK=false;setSync("","Saved on this device");}
}

function todaysPlan(){
  const st=STAGES[(state.settings.stage||1)-1], M=state.settings.minutes||45;
  const day=Math.floor(new Date(todayStr()).getTime()/864e5);
  const sk=KEYS[day%12];
  const sc=state.scales[sk.k]||{};
  const minorForms=[sc.harm?"harmonic":null,sc.mel?"melodic":null].filter(Boolean);
  let arpKey=KEYS.find(o=>state.arps[o.k]==="learning");
  let arpNew=false;
  if(!arpKey){const k=NEW_ARP_ORDER.find(k=>state.arps[k]==="none"); if(k){arpKey=KEYS.find(o=>o.k===k);arpNew=true;}}
  const solid=KEYS.filter(o=>state.arps[o.k]==="solid");
  const review=solid.length?solid[day%solid.length]:null;
  const open=c=>st.items.filter(i=>i.c===c&&!state.checks[i.id]);
  const rep=open("R"), et=open("E"), th=open("H");
  const techOpen=open("T").filter(i=>!/arpeggio/i.test(i.t));
  const w=[["warm",.15],["arp",.15],["etude",.15],["piece",.35],["keep",.10],["read",.10]];
  const mins={}; w.forEach(([k,f])=>mins[k]=Math.max(3,Math.round(M*f)));
  const blocks=[
    {id:"warm",cat:"Scales",ttl:`${pretty(sk.k)} major and ${sk.m} minor`,det:`Hands together at your current tempo (${sc.maj||95}). Minor: natural${minorForms.length?", "+minorForms.join(", "):""}.${techOpen[0]?" Then a few minutes on: "+techOpen[0].t+".":""}`,min:mins.warm},
    {id:"arp",cat:"Russian arpeggios",ttl:arpKey?`${arpNew?"Start":"Keep learning"}: ${pretty(arpKey.k)} major / ${arpKey.m} minor`:"Review a solid key",det:(arpKey?"Hands separately, slowly, all 11 forms. Mark the key as Learning, then Solid, on the Technique tab.":"")+(review?` Then one review run in ${pretty(review.k)}.`:""),min:mins.arp},
    {id:"etude",cat:"Étude",ttl:et[0]?et[0].t:"Choose an étude from the next stage",det:et[0]&&et[0].d?et[0].d:"Work in short sections at a slow, steady tempo.",min:mins.etude},
    {id:"piece",cat:"New piece",ttl:rep[0]?rep[0].t:"Stage repertoire complete",det:rep[0]&&rep[0].d?rep[0].d:"Pick a section of 4–8 bars, hands separately, then together.",min:mins.piece},
    {id:"keep",cat:"Keep up",ttl:MAINTAIN[day%2].t,det:MAINTAIN[day%2].d,min:mins.keep},
    {id:"read",cat:"Sight-reading",ttl:"Sight-read something new",det:th[0]?`Theory to look at this week: ${th[0].t}.`:"Read at a steady tempo without stopping.",min:mins.read}
  ];
  return {st,blocks,total:blocks.reduce((a,b)=>a+b.min,0)};
}
function todayDone(){ if(!state.today||state.today.date!==todayStr()) return {}; return state.today.done||{}; }

/* Block timer (memory only) */
const T={id:null,left:0,running:false,iv:null,last:0};
function startTimer(id,min){
  ensureCtx();
  if(T.id!==id){T.id=id;T.left=min*60;}
  T.running=!T.running; T.last=performance.now();
  clearInterval(T.iv);
  if(T.running) T.iv=setInterval(()=>{
    const now=performance.now(); T.left-=(now-T.last)/1000; T.last=now;
    const el=document.getElementById("tm-"+id); if(el) el.textContent=fmt(T.left);
    if(T.left<=0){clearInterval(T.iv);T.running=false;chime();markBlock(id,true);}
  },250);
  render();
}
function markBlock(id,val){
  const d=todayStr(); if(!state.today||state.today.date!==d) state.today={date:d,done:{}};
  if(val) state.today.done[id]=true; else delete state.today.done[id];
  if(T.id===id&&val){clearInterval(T.iv);T.running=false;T.id=null;}
  commit();
}

/* ---------- Metronome ---------- */
const Met={ctx:null,on:false,bpm:95,beats:3,next:0,beat:0,iv:null,taps:[]};
function ensureCtx(){
  try{
    if(!Met.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;Met.ctx=new AC();}
    if(Met.ctx.state==="suspended") Met.ctx.resume();
  }catch(e){return null;}
  return Met.ctx;
}
function click(t,acc){
  const c=Met.ctx,o=c.createOscillator(),g=c.createGain();
  o.frequency.value=acc?1568:1046;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(acc?0.7:0.4,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.06);
}
function chime(){const c=ensureCtx();if(!c)return;const t=c.currentTime;[784,988,1175].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+i*.15);g.gain.exponentialRampToValueAtTime(.3,t+i*.15+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.15+.4);o.connect(g);g.connect(c.destination);o.start(t+i*.15);o.stop(t+i*.15+.45);});}
function dots(){const d=$("#mDots");d.innerHTML=Array.from({length:Met.beats},()=>"<i></i>").join("");}
function flash(b){const is=$("#mDots").children;[...is].forEach((x,i)=>x.classList.toggle("on",i===b));}
function schedule(){const c=Met.ctx;while(Met.next<c.currentTime+0.12){const b=Met.beat,when=Met.next;click(when,b===0&&Met.beats>1);setTimeout(()=>flash(b),Math.max(0,(when-c.currentTime)*1000));Met.beat=(Met.beat+1)%Met.beats;Met.next+=60/Met.bpm;}}
function setBpm(v){Met.bpm=Math.max(30,Math.min(220,Math.round(v)));$("#mBpm").textContent=Met.bpm;$("#mRange").value=Met.bpm;}
$("#mGo").addEventListener("click",()=>{
  if(Met.on){Met.on=false;clearInterval(Met.iv);flash(-1);$("#mGo").textContent="Start";return;}
  const c=ensureCtx(); if(!c){$("#mGo").textContent="No audio";return;}
  Met.on=true;Met.beat=0;Met.next=c.currentTime+0.06;Met.iv=setInterval(schedule,25);schedule();$("#mGo").textContent="Stop";
});
$("#mUp").addEventListener("click",()=>setBpm(Met.bpm+1));
$("#mDown").addEventListener("click",()=>setBpm(Met.bpm-1));
$("#mRange").addEventListener("input",e=>setBpm(+e.target.value));
$("#mBeats").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;Met.beats=+b.dataset.b;Met.beat=0;[...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed",x===b));dots();});
$("#mTap").addEventListener("click",()=>{const now=performance.now();Met.taps=Met.taps.filter(t=>now-t<2500);Met.taps.push(now);if(Met.taps.length>=2){const iv=[];for(let i=1;i<Met.taps.length;i++)iv.push(Met.taps[i]-Met.taps[i-1]);const avg=iv.slice(-4).reduce((a,b)=>a+b,0)/Math.min(4,iv.length);setBpm(60000/avg);}});
dots();

render();
setTimeout(connect,0);
</script>
</body>
</html>
